<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./qgis2web_densité/resources/ol.css">
        <link rel="stylesheet" href="qgis2web_densité/resources/fontawesome-all.min.css">
        <link href="qgis2web_densité/resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./qgis2web_densité/resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./qgis2web_densité/resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* BARRE MENU */
        .navbar {
            background: linear-gradient(120deg, #4FACFE, #43E97B);
            width: 100%;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .navbar-title {
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #map {
            margin-top: 45px;
            height: calc(100% - 45px);
        }
        </style>

        <title>Densité de bâti dans la métropole toulousaine</title>

    </head>
    <body>

        <!-- BARRE DE NAVIGATION -->
        <div class="navbar">
            <span class="navbar-title">Densité de bâti dans la métropole toulousaine</span>
            <a href="indexicu.html" style="
                margin-left: auto;
                background: white;
                color: #4FACFE;
                padding: 6px 14px;
                border-radius: 5px;
                text-decoration: none;
                font-family: Arial, sans-serif;
                font-size: 14px;
                font-weight: bold;
            ">🌡️ Carte ICU →</a>
        </div>

        <!-- 
            CARTE N°2 : Densité de bâti dans la métropole toulousaine
            Cette carte présente la densité de bâti 
            dans la métropole toulousaine
        -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- TITRE visible sur la carte -->
        <div style="
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            padding: 8px 20px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            white-space: nowrap;
        ">Densité de bâti dans la métropole toulousaine</div>

        <!-- DESCRIPTION en bas de carte -->
        <div style="
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            max-width: 600px;
            text-align: center;
            line-height: 1.5;
        ">Carte qui représente la densité de bâti dans la métropole toulousaine, par carreau donc et permettant de faire ensuite le lien avec l'ICU.</div>

        <!-- SOURCE en bas de carte -->
        <div style="
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.8);
            padding: 4px 12px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            white-space: nowrap;
        ">Auteur : Marsaud Tom</div>

        <script src="qgis2web_densité/resources/qgis2web_expressions.js"></script>
        <script src="qgis2web_densité/resources/proj4.js"></script>
        <script>proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');</script>
        <script src="./qgis2web_densité/resources/functions.js"></script>
        <script src="./qgis2web_densité/resources/ol.js"></script>
        <script src="./qgis2web_densité/resources/ol-layerswitcher.js"></script>
        <script src="qgis2web_densité/resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="qgis2web_densité/resources/olms.js"></script>
        <script src="qgis2web_densité/layers/densit_bti_2.js"></script>
        <script src="qgis2web_densité/layers/territoritoires_tm_3.js"></script>
        <script src="qgis2web_densité/styles/densit_bti_2_style.js"></script>
        <script src="qgis2web_densité/styles/territoritoires_tm_3_style.js"></script>
        <script src="./qgis2web_densité/layers/layers.js" type="text/javascript"></script>
        <script src="./qgis2web_densité/resources/Autolinker.min.js"></script>
        <script src="./qgis2web_densité/resources/qgis2web.js"></script>

    </body>
</html>
